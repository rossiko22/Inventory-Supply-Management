# Single-node Kafka in KRaft mode (no Zookeeper) to fit the sandbox.
# Storage is ephemeral (/tmp) — fine for a demo; messages don't survive restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # The image's /opt/kafka/config is not writable under OpenShift's random
      # UID. Copy the defaults into a writable emptyDir and mount it there so
      # the entrypoint can write the generated server.properties.
      initContainers:
        - name: init-config
          image: apache/kafka:3.8.0
          command: ["sh", "-c", "cp -a /opt/kafka/config/. /mnt/config/"]
          volumeMounts:
            - name: kafka-config
              mountPath: /mnt/config
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          volumeMounts:
            - name: kafka-config
              mountPath: /opt/kafka/config
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
            # App/GC log dir — default (/opt/kafka/logs) is not writable under
            # OpenShift's random UID, so redirect it to the writable /tmp.
            - name: LOG_DIR
              value: "/tmp/kafka-logs"
            - name: CLUSTER_ID
              value: "kRaftClusterId000000001"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms256M"
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { memory: "384Mi", cpu: "100m" }
            limits:   { memory: "768Mi", cpu: "700m" }
      volumes:
        - name: kafka-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
