apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: { app: notification-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: DOCKERHUB_USER/notification-service:latest
          ports:
            - containerPort: 8088   # HTTP API
            - containerPort: 9091   # WebSocket
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: DB_PORT } }
            - name: DB_NAME
              value: "notifications"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } }
            - name: KAFKA_BROKERS
              valueFrom: { configMapKeyRef: { name: app-config, key: KAFKA_BROKERS } }
            - name: WS_PORT
              value: "9091"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } }
          readinessProbe:
            tcpSocket: { port: 8088 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: 8088 }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { memory: "96Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "400m" }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels: { app: notification-service }
spec:
  selector: { app: notification-service }
  ports:
    - name: http
      port: 8088
      targetPort: 8088
    - name: ws
      port: 9091
      targetPort: 9091
