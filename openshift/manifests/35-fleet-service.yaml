apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-service
  labels: { app: fleet-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fleet-service }
  template:
    metadata:
      labels: { app: fleet-service }
    spec:
      containers:
        - name: fleet-service
          image: DOCKERHUB_USER/fleet-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } }
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=fleet;Username=$(DB_USER);Password=$(DB_PASSWORD)"
            - name: ASPNETCORE_URLS
              value: "http://+:8083"
          readinessProbe:
            tcpSocket: { port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: 8083 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "384Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-service
  labels: { app: fleet-service }
spec:
  selector: { app: fleet-service }
  ports:
    - port: 8083
      targetPort: 8083
