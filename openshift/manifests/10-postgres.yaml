# Single PostgreSQL instance hosting all 8 logical databases.
# Uses the OpenShift-friendly sclorg image (tolerates the random non-root UID
# that the restricted SCC assigns). The first DB ("users") is created by the
# image; a start hook creates the remaining 7.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app: postgres
data:
  create-databases.sh: |
    # Runs on every start (sclorg sources files in postgresql-start/) as the DB
    # superuser over the local unix socket. Idempotent. NOTE: during this phase
    # the server listens on the socket only (not TCP), so do NOT pass -h/-U.
    for db in companies fleet warehouses products inventory orders notifications; do
      exists=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$db'")
      if [ "$exists" != "1" ]; then
        echo "[init] creating database $db"
        psql -c "CREATE DATABASE \"$db\" OWNER \"$POSTGRESQL_USER\";"
      fi
    done
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app: postgres
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-15-c9s:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_USER } }
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } }
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } }
            - name: POSTGRESQL_DATABASE
              value: "users"
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: init
              mountPath: /opt/app-root/src/postgresql-start
          readinessProbe:
            exec:
              command: ["/usr/bin/pg_isready", "-h", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
