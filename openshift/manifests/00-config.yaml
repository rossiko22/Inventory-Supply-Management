# Shared configuration + secrets for the whole stack.
# Service URLs use in-cluster DNS (<service>.<namespace>.svc — short name works
# within the same namespace).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app.kubernetes.io/part-of: inventory-system
data:
  # Messaging
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"   # Spring (relaxed binding) + .NET
  KAFKA_BROKERS:           "kafka:9092"   # notification-service (kafkajs)
  # Database host (single Postgres holding all 8 logical databases)
  DB_HOST: "postgres"
  DB_PORT: "5432"
  # gRPC endpoint used by order-service -> inventory-service
  INVENTORY_GRPC_URL: "http://inventory-service:9090"
  # Downstream service URLs (used by the two gateways)
  AUTH_SERVICE_URL:         "http://auth-service:8081"
  COMPANY_SERVICE_URL:      "http://company-service:8082"
  FLEET_SERVICE_URL:        "http://fleet-service:8083"
  WAREHOUSE_SERVICE_URL:    "http://warehouse-service:8084"
  PRODUCT_SERVICE_URL:      "http://product-service:8085"
  INVENTORY_SERVICE_URL:    "http://inventory-service:8086"
  ORDER_SERVICE_URL:        "http://order-service:8087"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8088"
  NOTIFICATION_WS_URL:      "ws://notification-service:9091"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/part-of: inventory-system
type: Opaque
stringData:
  DB_USER: "administrator"
  DB_PASSWORD: "administrator123"
  # Must match the HMAC secret auth-service signs JWTs with.
  JWT_SECRET: "ewzqAN2z1bq7yYFcN3/KId4wbohavFXxHE7nnr82lZE="
