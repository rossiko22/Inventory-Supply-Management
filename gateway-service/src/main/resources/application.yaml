server:
  port: 8080

spring:
  application:
    name: gateway-service

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: company-service
              uri: ${COMPANY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/companies/**
            - id: fleet-service
              uri: ${FLEET_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/drivers/**,/vehicles/**
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/inventory/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/notifications/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/orders/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/products/**,/categories/**
            - id: warehouses-service
              uri: ${WAREHOUSE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/warehouses/**