    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-app/inventory-system-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web-app/inventory-system-frontend
        run: npm ci

      - name: Run unit tests
        working-directory: web-app/inventory-system-frontend
        run: npm test

      - name: Build production bundle
        working-directory: web-app/inventory-system-frontend
        run: npm run build

  # ── Micro-frontends ───────────────────────────────────────────────────────
