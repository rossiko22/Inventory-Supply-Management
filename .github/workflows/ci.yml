          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-products:latest

  # ── End-to-end (Playwright) ──────────────────────────────────────────────
  # Skipped on PRs because it starts the full compose stack — slow + flaky on
  # shared runners. Runs on pushes to main/master and on manual dispatch.
  e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - build-auth-microservice
      - build-company-microservice
      - build-warehouse-microservice
      - build-inventory-microservice
      - build-fleet-microservice
      - build-product-microservice
      - build-order-microservice
      - build-notification-microservice
      - build-mobile-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm install

      - name: Install browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start backend stack
        run: docker compose up -d
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Wait for mobile-gateway to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8090/health > /dev/null 2>&1; then
              echo "Gateway up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway never came up — dumping logs"
          docker compose logs
          exit 1

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: http://localhost:8090

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose down -v
