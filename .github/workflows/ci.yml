  build-mf-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: micro-frontends/inventory-mf/package-lock.json
      - name: Install dependencies
        working-directory: micro-frontends/inventory-mf
        run: npm ci
      - name: Run unit tests
        working-directory: micro-frontends/inventory-mf
        run: npm test
      - name: Build
        working-directory: micro-frontends/inventory-mf
        run: npm run build
      - name: Build Docker image
        working-directory: micro-frontends/inventory-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-inventory:latest .
      - name: Push to DockerHub
