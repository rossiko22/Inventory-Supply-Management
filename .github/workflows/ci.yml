  build-mf-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: micro-frontends/auth-mf/package-lock.json
      - name: Install dependencies
        working-directory: micro-frontends/auth-mf
        run: npm ci
      - name: Run unit tests
        working-directory: micro-frontends/auth-mf
        run: npm test
      - name: Build
        working-directory: micro-frontends/auth-mf
        run: npm run build
      - name: Build Docker image
        working-directory: micro-frontends/auth-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-auth:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-auth:latest

  build-mf-warehouses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: micro-frontends/warehouses-mf/package-lock.json
      - name: Install dependencies
        working-directory: micro-frontends/warehouses-mf
        run: npm ci
      - name: Run unit tests
        working-directory: micro-frontends/warehouses-mf
        run: npm test
      - name: Build
        working-directory: micro-frontends/warehouses-mf
        run: npm run build
      - name: Build Docker image
        working-directory: micro-frontends/warehouses-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-warehouses:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
