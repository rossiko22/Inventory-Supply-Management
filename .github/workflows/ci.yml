      - name: Run unit tests
        working-directory: micro-frontends/shell
        run: npm test
      - name: Build
        working-directory: micro-frontends/shell
        run: npm run build
      - name: Build Docker image
        working-directory: micro-frontends/shell
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-shell:latest .
      - name: Push to DockerHub
