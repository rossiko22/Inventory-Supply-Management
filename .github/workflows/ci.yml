name: Inventory Microservices CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  # ── Java / Spring services ───────────────────────────────────────────────
  build-warehouse-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and test warehouse service
        working-directory: services/warehouse-service
        run: mvn clean package -DskipTests=false

      - name: Build Docker image
        working-directory: services/warehouse-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-service:latest

  build-inventory-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and test inventory service
        working-directory: services/inventory-service
        run: mvn clean package -DskipTests=false

      - name: Build Docker image
        working-directory: services/inventory-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/inventory-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/inventory-service:latest

  # ── .NET services ────────────────────────────────────────────────────────
  build-order-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: services/order-service
        run: dotnet restore

      - name: Build order service
        working-directory: services/order-service
        run: dotnet build --no-restore -c Release

      - name: Run unit tests
        working-directory: services/order-service
        run: dotnet test order-service.Tests/order-service.Tests.csproj --no-build -c Release

      - name: Build Docker image
        working-directory: services/order-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest

  # ── Node.js services ─────────────────────────────────────────────────────
  build-notification-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/notification-service/package-lock.json

      - name: Install dependencies
        working-directory: services/notification-service
        run: npm ci

      - name: Build notification service
        working-directory: services/notification-service
        run: npm run build

      - name: Run unit tests
        working-directory: services/notification-service
        run: npm test

      - name: Build Docker image
        working-directory: services/notification-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest

  # ── Mobile Gateway (Express/TypeScript) ──────────────────────────────────
  build-mobile-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-gateway/package-lock.json

      - name: Install dependencies
        working-directory: mobile-gateway
        run: npm install

      - name: Build mobile gateway
        working-directory: mobile-gateway
        run: npm run build

      - name: Build Docker image
        working-directory: mobile-gateway
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mobile-gateway:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mobile-gateway:latest

  # ── Micro-frontends ───────────────────────────────────────────────────────
  build-mf-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: micro-frontends/shell/package-lock.json
      - run: npm install
        working-directory: micro-frontends/shell
      - run: npm run build
        working-directory: micro-frontends/shell
      - name: Build Docker image
        working-directory: micro-frontends/shell
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-shell:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-shell:latest

  build-mf-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: micro-frontends/auth-mf
      - run: npm run build
        working-directory: micro-frontends/auth-mf
      - name: Build Docker image
        working-directory: micro-frontends/auth-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-auth:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-auth:latest

  build-mf-warehouses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: micro-frontends/warehouses-mf
      - run: npm run build
        working-directory: micro-frontends/warehouses-mf
      - name: Build Docker image
        working-directory: micro-frontends/warehouses-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-warehouses:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-warehouses:latest

  build-mf-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: micro-frontends/inventory-mf
      - run: npm run build
        working-directory: micro-frontends/inventory-mf
      - name: Build Docker image
        working-directory: micro-frontends/inventory-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-inventory:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-inventory:latest

  build-mf-orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: micro-frontends/orders-mf
      - run: npm run build
        working-directory: micro-frontends/orders-mf
      - name: Build Docker image
        working-directory: micro-frontends/orders-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-orders:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-orders:latest

  build-mf-companies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: micro-frontends/companies-mf
      - run: npm run build
        working-directory: micro-frontends/companies-mf
      - name: Build Docker image
        working-directory: micro-frontends/companies-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-companies:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-companies:latest

  build-mf-fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: micro-frontends/fleet-mf
      - run: npm run build
        working-directory: micro-frontends/fleet-mf
      - name: Build Docker image
        working-directory: micro-frontends/fleet-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-fleet:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-fleet:latest

  build-mf-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: micro-frontends/products-mf
      - run: npm run build
        working-directory: micro-frontends/products-mf
      - name: Build Docker image
        working-directory: micro-frontends/products-mf
