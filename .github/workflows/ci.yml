name: Inventory Microservices CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # ── Java / Spring services ───────────────────────────────────────────────
  build-auth-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit + integration tests
        working-directory: services/auth-service
        run: mvn test

      - name: Build auth service
        working-directory: services/auth-service
        run: mvn clean package -DskipTests

      - name: Build Docker image
        working-directory: services/auth-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest

  build-company-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit + integration tests
        working-directory: services/company-service
        run: mvn test

      - name: Build company service
        working-directory: services/company-service
        run: mvn clean package -DskipTests

      - name: Build Docker image
        working-directory: services/company-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/company-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/company-service:latest

  build-warehouse-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit + integration tests
        working-directory: services/warehouse-service
        run: mvn test

      - name: Build warehouse service
        working-directory: services/warehouse-service
        run: mvn clean package -DskipTests

      - name: Build Docker image
        working-directory: services/warehouse-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-service:latest

  build-inventory-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit + integration tests
        working-directory: services/inventory-service
        run: mvn test

      - name: Build inventory service
        working-directory: services/inventory-service
        run: mvn clean package -DskipTests

      - name: Build Docker image
        working-directory: services/inventory-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/inventory-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/inventory-service:latest

  # ── .NET services ────────────────────────────────────────────────────────
  build-fleet-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: services/fleet-service/fleet-service.Tests
        run: dotnet restore

      - name: Build fleet service
        working-directory: services/fleet-service/fleet-service.Tests
        run: dotnet build --no-restore -c Release

      - name: Run unit tests
        working-directory: services/fleet-service/fleet-service.Tests
        run: dotnet test --no-build -c Release

      - name: Build Docker image
        working-directory: services/fleet-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/fleet-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fleet-service:latest

  build-product-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: services/product-service/product-service.Tests
        run: dotnet restore

      - name: Build product service
        working-directory: services/product-service/product-service.Tests
        run: dotnet build --no-restore -c Release

      - name: Run unit tests
        working-directory: services/product-service/product-service.Tests
        run: dotnet test --no-build -c Release

      - name: Build Docker image
        working-directory: services/product-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest

  build-order-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
