        run: npm test
      - name: Build
        working-directory: micro-frontends/fleet-mf
        run: npm run build
      - name: Build Docker image
        working-directory: micro-frontends/fleet-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-fleet:latest .
