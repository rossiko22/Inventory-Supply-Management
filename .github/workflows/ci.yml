  # ── Node.js services ─────────────────────────────────────────────────────
  build-notification-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/notification-service/package-lock.json

      - name: Install dependencies
        working-directory: services/notification-service
        run: npm ci

      - name: Run unit tests
        working-directory: services/notification-service
        run: npm test

      - name: Build notification service
        working-directory: services/notification-service
        run: npm run build

      - name: Build Docker image
        working-directory: services/notification-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest .

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
