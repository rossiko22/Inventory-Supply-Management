          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest

  build-ai-microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
