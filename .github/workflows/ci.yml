        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mf-inventory:latest

  build-mf-orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: micro-frontends/orders-mf/package-lock.json
      - name: Install dependencies
        working-directory: micro-frontends/orders-mf
        run: npm ci
      - name: Run unit tests
        working-directory: micro-frontends/orders-mf
        run: npm test
      - name: Build
        working-directory: micro-frontends/orders-mf
        run: npm run build
      - name: Build Docker image
        working-directory: micro-frontends/orders-mf
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mf-orders:latest .
      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
